<style>

.cap{font-size:14px;color:var(--soft);margin:0}

#bar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--gold);z-index:30}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:6px 6px 120px 120px/6px 6px 40px 40px;padding:36px 24px 34px;text-align:center;box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6px var(--line)}

.fig{position:relative;display:flex;justify-content:center;width:min(100%,290px);height:190px;margin:0 auto 12px}
.fig .w{position:relative;height:100%}.fig .w img{height:100%;width:auto;display:block;filter:drop-shadow(0 6px 8px #5b1a1a33)}
.fig .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

.rock{transform-origin:50% 100%;animation:rock 1.1s ease-in-out infinite alternate}@keyframes rock{to{transform:translateY(-5px) rotate(1.8deg)}}
.flt{animation:flt 3.5s ease-in-out infinite alternate}@keyframes flt{to{transform:translateY(-5px)}}
.venueimg{display:block;margin:0 auto 8px;height:76px;width:auto}
.frame{position:fixed;inset:6px;border:1.5px solid var(--gold);box-shadow:inset 0 0 0 4px transparent,inset 0 0 0 5px #c9a24a77;pointer-events:none;z-index:40}

.hero,main,footer{position:relative;z-index:1}
.gan{display:block;width:78px;margin:0 auto 4px}
.couple{display:flex;justify-content:center;align-items:flex-end;margin:10px auto 0}.couple img{height:min(64vw,310px);width:auto}

.card::before{content:"";position:absolute;top:-10px;left:8%;right:8%;height:14px;background:radial-gradient(circle at 8px 7px,#f29a12 5.4px,#e8730c 6px,transparent 6.6px) 0 0/17px 14px repeat-x}

.card{background:rgba(251,243,222,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:inset 0 0 0 5px transparent,inset 0 0 0 6px rgba(169,124,31,.5),0 10px 30px rgba(91,15,28,.09)}

.time{border:1px solid var(--gold);letter-spacing:.05em;box-shadow:0 0 0 3px rgba(201,162,74,.25)}
.hero h1{background:linear-gradient(180deg,#8a1c2c 25%,#4d0b17);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.01em}

.invite{font-style:italic;line-height:1.7}
.btn{background:linear-gradient(135deg,#7a1424,#52101b);border-color:#c9a24a;box-shadow:0 6px 16px rgba(91,15,28,.25);letter-spacing:.03em}

nav{background:rgba(244,231,200,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
nav a{border-color:var(--gold);color:var(--maroon);font-family:var(--serif);font-size:17px}
.close .gan{width:70px}
#petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.pl{position:absolute;top:-30px;opacity:0;border-radius:70% 0 70% 0;animation:pf linear infinite}
@keyframes pf{0%{transform:translate3d(0,-5vh,0) rotate(0);opacity:0}12%{opacity:.34}88%{opacity:.26}100%{transform:translate3d(var(--dx),108vh,0) rotate(var(--r));opacity:0}}

/* calligraphic names */
.hero h1,#intro h1{font-family:'Pinyon Script','Snell Roundhand','Apple Chancery',cursive;font-style:normal;font-weight:400;line-height:1.08;letter-spacing:0}
.hero h1{font-size:clamp(54px,17vw,112px);filter:drop-shadow(0 2px 0 rgba(201,162,74,.4))}
.hero h1 .amp{display:flex;align-items:center;justify-content:center;gap:14px;font:500 clamp(14px,3.6vw,18px)/1 'Cinzel',Georgia,serif;letter-spacing:.5em;text-indent:.5em;margin:.5em 0;-webkit-text-fill-color:var(--gold)}
.hero h1 .amp::before,.hero h1 .amp::after{content:'';height:1px;width:clamp(36px,12vw,80px);background:linear-gradient(90deg,transparent,var(--gold))}
.hero h1 .amp::after{transform:scaleX(-1)}
#intro h1{font-size:clamp(50px,15vw,80px);color:#f3dca0;text-shadow:0 2px 12px rgba(0,0,0,.35)}
/* card border matched to the gold page frame */
.card{border:1.5px solid #b98b2e;border-radius:16px;outline:1px solid rgba(185,139,46,.5);outline-offset:5px;box-shadow:inset 0 0 0 6px transparent,inset 0 0 0 7px rgba(185,139,46,.55),0 10px 30px rgba(91,15,28,.09)}
/* floating glass cards: no borders */
.card{border:0;outline:0;border-radius:30px;background:linear-gradient(150deg,rgba(255,255,255,.46),rgba(255,247,226,.2));backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);box-shadow:0 22px 44px -12px rgba(91,15,28,.2),inset 0 0 46px rgba(255,255,255,.28);animation:glassfloat 6s ease-in-out infinite alternate}
.card::before,.cn{display:none}
@keyframes glassfloat{to{transform:translateY(-5px)}}
/* colour glow behind glass, maroon finale, emerald + foil accents */
.ev{position:relative}
.ev::before{content:'';position:absolute;left:-6%;right:-6%;top:10%;bottom:0;background:radial-gradient(ellipse at 50% 55%,var(--glow,transparent) 0,transparent 68%);filter:blur(26px);z-index:-1;pointer-events:none}
#tilak{--glow:rgba(138,28,44,.42)}#haldi{--glow:rgba(242,176,30,.55)}#baraat{--glow:rgba(205,30,40,.4)}#wedding{--glow:rgba(190,50,100,.4)}
footer.close{max-width:none;margin-top:70px;padding:80px 22px 110px;background:linear-gradient(180deg,#5b0f1c,#3a0812);color:#f3e2b8;border-radius:44px 44px 0 0}
.close>*{max-width:600px;margin-left:auto;margin-right:auto}
.close h2{color:#f3dca0}.close .fam{color:#d9c08a}.close .fam b{color:#f6e3b4}
.close .rule::after{background:#4a0b16}
.close .gan{background:#f6e9c8;border:2px solid #c9a24a;border-radius:50%;padding:12px;width:86px}
.close .btn{background:linear-gradient(135deg,#ecd08a,#b98b2e);color:#3a0a12;border-color:#ecd08a;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.close .btn.ghost{background:transparent;color:#f3dca0;border-color:#c9a24a;box-shadow:none}
.rule{background:linear-gradient(90deg,transparent,#ecd08a,#a97c1f,#ecd08a,transparent) center/100% 1.5px no-repeat}

.time{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent),#000 28%));border-color:#d6b25e}

.arm{transform-box:fill-box;transform-origin:0% 50%;animation:swing 1.6s ease-in-out infinite}

.close{text-align:center;max-width:640px;margin:0 auto;padding:72px 22px 90px}
.close h2{font-size:clamp(36px,10vw,52px);color:var(--maroon)}

.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}

.rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease}

</head>

<div id="bar"></div>
<div id="petals" aria-hidden="true"></div><div class="frame" aria-hidden="true"><i class="tl"></i><i class="tr"></i></div><img class="bl" id="lb" alt=""><img class="br" id="lr" alt="">

const mapUrl=v=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(v.name+", "+v.address);
const venue=k=>k==="groom"?W.groomVenue:W.brideVenue;

$("#ig").src=$("#gan").src=IM.ganesh;$("#gm").src=IM.groom;$("#bd").src=IM.bride;$("#lb").src=$("#lr").src=IM.lotus;document.querySelectorAll(".frame i").forEach(e=>e.style.backgroundImage="url("+IM.corner+")");
$("#mantra").textContent=W.mantra; $("#invite").textContent=W.invite;

/* events + nav */
const nav=$("#nav"), main=$("#events");
W.events.forEach(ev=>{
  if(!ev.title) return;
  const a=E("a","",esc(ev.title.replace("Shubh ","").replace(" Prasthan",""))); a.href="#"+ev.id;
  a.addEventListener("click",e=>{e.preventDefault();$("#"+ev.id).scrollIntoView()}); nav.append(a);
  const s=E("section","ev rv"); s.id=ev.id;
  let h='<article class="card '+ev.cls+'"><i class="cn l"></i><i class="cn r"></i>'+(SC[ev.id]||IC[ev.icon]||"")+(ev.subtitle?'<div class="tag">'+esc(ev.subtitle)+'</div>':"")+'<h2>'+esc(ev.title)+'</h2>'+
    (ev.day?'<p class="when">'+esc(ev.day)+'</p>':"")+(ev.time?'<span class="time">'+esc(ev.time)+'</span>':"")+(ev.note?'<p class="cap">'+esc(ev.note)+'</p>':"");
  (ev.places||[]).forEach(p=>{const [k,l]=Array.isArray(p)?p:[p,""],v=venue(k);if(!v||!v.name)return;
    h+='<div class="place">'+(k==="groom"?'<img class="venueimg" loading="lazy" src="'+IM.hotel+'" alt="">':"")+(l?'<small>'+esc(l)+'</small>':"")+'<strong>'+esc(v.name)+'</strong><p>'+esc(v.address||"")+'</p><a class="btn ghost" target="_blank" rel="noopener" href="'+mapUrl(v)+'">Get Directions</a></div>'});
  s.innerHTML=h+'</article>'; main.append(s);
});

/* closing */
const H=W.hosts, C=W.contact, fam=$("#families");
fam.innerHTML=
 '<p class="fam rv"><b>Invitation from</b><br>'+esc(H.groomParents)+'<br>'+esc(H.groomGrand)+'</p>'+
 '<p class="fam rv"><b>Bride’s parents</b><br>'+esc(H.brideParents)+'</p>'+
 '<p class="fam rv"><b>With blessings of</b><br>'+esc(H.elders)+'<br><i>'+esc(H.remembrance)+'</i></p>'+
 '<p class="fam rv"><b>Eagerly awaiting your presence</b><br>'+esc(H.family)+'<br>and all friends &amp; relatives</p>'+
 '<p class="fam rv"><b>'+esc(C.name)+'</b><br>'+esc(C.address)+'</p>'+(W.hashtag?'<p class="fam">'+esc(W.hashtag)+'</p>':"");
const acts=$("#acts");
C.phones.forEach((p,i)=>{const a=E("a","btn"+(i?" ghost":""),"Call "+(i?"(alt) ":"")+esc(p));a.href="tel:+91"+p;acts.append(a)});
const sh=E("button","btn ghost","Share invitation");sh.type="button";acts.append(sh);
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)};
sh.onclick=async()=>{const d={title:document.title,text:"You’re invited to the wedding of "+W.partner1+" & "+W.partner2,url:location.href};
  try{if(navigator.share){await navigator.share(d);return}await navigator.clipboard.writeText(d.url);toast("Link copied")}
  catch(e){if(e&&e.name==="AbortError")return;try{const i=E("textarea");i.value=d.url;document.body.append(i);i.select();document.execCommand("copy");i.remove();toast("Link copied")}catch(_){toast("Copy the link from your address bar")}}};

/* intro */
const intro=$("#intro"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
document.body.style.overflow="hidden";
const finish=()=>{intro.classList.add("gone");document.body.style.overflow="";$("#top").scrollIntoView()};
let audio=null;
if(W.music){audio=new Audio(W.music);audio.loop=true;audio.preload='none';
 const mb=E('button','','♪');mb.id='music';mb.type='button';document.body.append(mb);
 const sync=()=>{const p=!audio.paused;mb.classList.toggle('on',p);mb.textContent=p?'❚❚':'♪';mb.setAttribute('aria-label',p?'Pause background music':'Play background music')};
 audio.onplay=audio.onpause=sync;sync();
 audio.onerror=()=>{mb.hidden=true};
 mb.onclick=()=>audio.paused?audio.play().catch(()=>toast('Music could not be played')):audio.pause()}
const startMusic=()=>{if(audio&&audio.paused)audio.play().catch(()=>{})};
$('#openBtn').onclick=()=>{startMusic();intro.classList.add('open');setTimeout(finish,reduce?50:1500)};

$("#openBtn").focus();

/* countdown (hidden if missing, invalid or past) */
(function(){const t=Date.parse(W.countdownTo);if(!W.countdownTo||isNaN(t)||t<=Date.now())return;
 $("#countWrap").hidden=false;$("#capt").textContent=W.countdownLabel||"";
 const f=()=>{let d=Math.max(0,t-Date.now());if(!d){$("#countWrap").hidden=true;clearInterval(iv);return}
  const s=Math.floor(d/1e3);$("#cd").textContent=Math.floor(s/86400);$("#ch").textContent=Math.floor(s%86400/3600);$("#cm").textContent=Math.floor(s%3600/60);$("#cs").textContent=s%60};
 f();const iv=setInterval(f,1000)})();

/* soft falling petals + royal details */
$('#gf').src=IM.ganesh;document.documentElement.style.setProperty('--cnimg','url('+IM.corner+')');
(function(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const L=$('#petals'),C=['#e9a33a','#d9788a','#f1cf80','#c9a24a','#e8b4a8'];
for(let i=0;i<18;i++){const p=E('i','pl'),s=9+Math.random()*9;p.style.cssText='left:'+Math.random()*100+'%;width:'+s+'px;height:'+s*1.25+'px;background:'+C[i%5]+';animation-duration:'+(12+Math.random()*10)+'s;animation-delay:-'+Math.random()*20+'s;--dx:'+(Math.random()*120-60)+'px;--r:'+(240+Math.random()*360)+'deg';L.append(p)}})();
/* nav highlights the ceremony in view */
const CL={tilak:'#8a1c2c',haldi:'#a86b00',baraat:'#b3151f',wedding:'#7a1030'},na={};
document.querySelectorAll('nav a').forEach(a=>{const id=a.getAttribute('href').slice(1);na[id]=a;a.style.setProperty('--c',CL[id]||'#6b1220')});
const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){Object.values(na).forEach(a=>a.classList.remove('on'));if(na[e.target.id])na[e.target.id].classList.add('on')}}),{rootMargin:'-40% 0px -50% 0px'});
document.querySelectorAll('.ev').forEach(s=>io2.observe(s));
/* reveal once + progress */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));
addEventListener("scroll",()=>{const h=document.documentElement;$("#bar").style.width=(scrollY/(h.scrollHeight-innerHeight||1)*100)+"%"},{passive:true});
</script>
</body>
</html>
